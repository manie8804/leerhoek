<style>
/* Layout concept: an exam pad — a soft grid-paper ground, one bold "highlighter" accent for progress and rewards,
   each subject keeps its own marker colour. Cards only where something is operable. */
:root {
  --bg: #f3f5fa;           /* grid-paper ground */
  --grid: rgba(31, 42, 92, 0.055);
  --surface: #ffffff;
  --surface-2: #eef1f8;
  --ink: #1b2340;
  --ink-2: #4b5472;
  --muted: #7d859f;
  --line: #dde2ee;
  --brand: #1f2a5c;        /* ink blue – headers, nav */
  --brand-ink: #ffffff;
  --hi: #ffc233;           /* highlighter – XP, rewards */
  --hi-ink: #3d2a00;
  --good: #1f9d55;
  --good-bg: #e3f6ea;
  --bad: #d64545;
  --bad-bg: #fde7e7;
  --warn: #d98c00;
  --shadow: 0 8px 24px rgba(27, 35, 64, 0.08);
  --shadow-sm: 0 2px 8px rgba(27, 35, 64, 0.07);
  --radius: 18px;
  --radius-sm: 12px;
  --font-display: "Fredoka", "Nunito", "Segoe UI", system-ui, sans-serif;
  --font-body: "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
  --subject: #2f6df6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1424; --grid: rgba(255,255,255,0.045); --surface: #182038; --surface-2: #1f2a47;
    --ink: #eef1fa; --ink-2: #c3c9de; --muted: #8e97b8; --line: #2b3657;
    --brand: #27336b; --brand-ink: #ffffff; --hi: #ffcd4d; --hi-ink: #2a1c00;
    --good: #3dd37b; --good-bg: #16331f; --bad: #ff6b6b; --bad-bg: #3a1c1c; --warn: #ffb020;
    --shadow: 0 8px 24px rgba(0,0,0,0.35); --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1424; --grid: rgba(255,255,255,0.045); --surface: #182038; --surface-2: #1f2a47;
  --ink: #eef1fa; --ink-2: #c3c9de; --muted: #8e97b8; --line: #2b3657;
  --brand: #27336b; --brand-ink: #ffffff; --hi: #ffcd4d; --hi-ink: #2a1c00;
  --good: #3dd37b; --good-bg: #16331f; --bad: #ff6b6b; --bad-bg: #3a1c1c; --warn: #ffb020;
  --shadow: 0 8px 24px rgba(0,0,0,0.35); --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; font-family: var(--font-body); font-size: 16px; line-height: 1.5; color: var(--ink);
  background: var(--bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 28px 28px;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 600; line-height: 1.15; margin: 0; text-wrap: balance; color: var(--ink); }
h1 { font-size: clamp(1.6rem, 4vw, 2.2rem); }
h2 { font-size: clamp(1.25rem, 3vw, 1.6rem); }
h3 { font-size: 1.1rem; }
p { margin: 0; }
a { color: inherit; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--hi); outline-offset: 2px; border-radius: 6px; }
input, select { font: inherit; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; }
input::placeholder { color: var(--muted); }
.label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 800; }
.num { font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }

/* ---------- shell ---------- */
#app { min-height: 100%; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--brand); color: var(--brand-ink);
  padding: 10px 16px; display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow-sm);
}
.topbar .logo { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; letter-spacing: 0.01em; }
.topbar .logo svg { width: 34px; height: 34px; }
.topbar .spacer { flex: 1; }
.topbar .who { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.12); padding: 4px 10px 4px 4px; border-radius: 999px; }
.topbar .who .av { width: 30px; height: 30px; border-radius: 50%; background: var(--hi); display: grid; place-items: center; font-size: 18px; }
.topbar .who .nm { font-weight: 800; font-size: 0.9rem; }
.lang { display: inline-flex; border: 1.5px solid rgba(255,255,255,0.35); border-radius: 999px; overflow: hidden; }
.lang button { padding: 4px 10px; font-weight: 800; font-size: 0.8rem; color: rgba(255,255,255,0.75); }
.lang button.on { background: var(--hi); color: var(--hi-ink); }
.iconbtn { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,0.12); font-size: 18px; }
.iconbtn:hover { background: rgba(255,255,255,0.22); }

main { flex: 1; width: 100%; max-width: 1100px; margin: 0 auto; padding-block: 20px 96px; padding-inline: 16px; }
@media (min-width: 900px) { main { padding-block: 28px 48px; } }

.bottomnav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: space-around;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
}
.bottomnav button { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 0.7rem; font-weight: 800; color: var(--muted); padding: 4px 10px; border-radius: 10px; min-width: 60px; }
.bottomnav button .ic { font-size: 20px; }
.bottomnav button.on { color: var(--brand); background: var(--surface-2); }
:root[data-theme="dark"] .bottomnav button.on, .bottomnav button.on { color: var(--ink); }
@media (min-width: 900px) { .bottomnav { display: none; } }
.desknav { display: none; gap: 4px; }
.desknav button { padding: 6px 12px; border-radius: 999px; font-weight: 800; font-size: 0.9rem; color: rgba(255,255,255,0.8); }
.desknav button.on, .desknav button:hover { background: rgba(255,255,255,0.14); color: #fff; }
@media (min-width: 900px) { .desknav { display: flex; } }

/* ---------- common blocks ---------- */
.card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow-sm); padding: 18px; }
.card.pad-lg { padding: 24px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.grid.two { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 18px; border-radius: 999px; font-weight: 800; font-size: 0.95rem; background: var(--surface-2); color: var(--ink); transition: transform .12s ease, box-shadow .12s ease, background .12s; min-height: 44px; }
.btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-sm); }
.btn:active { transform: translateY(0) scale(0.98); }
.btn.primary { background: var(--brand); color: var(--brand-ink); }
.btn.hi { background: var(--hi); color: var(--hi-ink); }
.btn.subject { background: var(--subject); color: #fff; }
.btn.ghost { background: transparent; border: 1.5px solid var(--line); }
.btn.sm { padding: 7px 12px; font-size: 0.85rem; min-height: 36px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: 0.5; pointer-events: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 800; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.chip.good { background: var(--good-bg); color: var(--good); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.chip.hi { background: var(--hi); color: var(--hi-ink); }
.chip.subject { background: color-mix(in srgb, var(--subject) 16%, transparent); color: var(--subject); }
.back { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; color: var(--muted); margin-bottom: 12px; }
.back:hover { color: var(--ink); }
.muted { color: var(--muted); }
.small { font-size: 0.88rem; }
.center { text-align: center; }
.sep { height: 1px; background: var(--line); margin: 6px 0; }
.banner { background: color-mix(in srgb, var(--hi) 25%, var(--surface)); border: 1.5px dashed var(--hi); border-radius: var(--radius-sm); padding: 10px 14px; font-size: 0.9rem; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 800; opacity: 0; transition: .25s; z-index: 50; pointer-events: none; box-shadow: var(--shadow); max-width: calc(100vw - 32px); }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
@media (min-width: 900px) { .toast { bottom: 28px; } }

/* progress ring */
.ring { width: 54px; height: 54px; position: relative; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 6; }
.ring .track { stroke: var(--line); }
.ring .bar { stroke: var(--subject); stroke-linecap: round; transition: stroke-dashoffset 0.9s cubic-bezier(.2,.8,.2,1); }
.ring .val { position: absolute; inset: 0; display: grid; place-items: center; font-size: 0.72rem; font-weight: 800; color: var(--ink-2); }
.bar-h { height: 10px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.bar-h > i { display: block; height: 100%; width: 0; background: var(--hi); border-radius: 999px; transition: width .8s cubic-bezier(.2,.8,.2,1); }
.bar-h.subject > i { background: var(--subject); }

/* ---------- profile gate ---------- */
.gate { max-width: 760px; margin: 0 auto; text-align: center; }
.gate .mascot { width: 120px; margin: 8px auto 4px; }
.gate h1 { margin-top: 6px; }
.gate .sub { color: var(--ink-2); margin-top: 6px; }
.profiles { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); margin-top: 24px; }
.profile { padding: 22px 14px; border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow-sm); display: flex; flex-direction: column; align-items: center; gap: 8px; transition: transform .15s, box-shadow .15s; border: 2px solid transparent; }
.profile:hover { transform: translateY(-3px); box-shadow: var(--shadow); border-color: var(--hi); }
.profile .big { width: 72px; height: 72px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-size: 38px; }
.profile .nm { font-family: var(--font-display); font-weight: 700; font-size: 1.2rem; }
.profile .lv { font-size: 0.8rem; color: var(--muted); font-weight: 700; }

/* ---------- home ---------- */
.hero { display: grid; gap: 16px; grid-template-columns: 1fr; align-items: center; }
@media (min-width: 760px) { .hero { grid-template-columns: 1.4fr 1fr; } }
.hero .greet h1 span { color: var(--subject); }
.xpcard { background: var(--brand); color: var(--brand-ink); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.xpcard::after { content: ""; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%; background: rgba(255,255,255,0.06); }
.xpcard .lvl { font-family: var(--font-display); font-size: 1.4rem; font-weight: 700; }
.xpcard .bar-h { background: rgba(255,255,255,0.18); margin-top: 10px; }
.xpcard .meta { display: flex; justify-content: space-between; font-size: 0.8rem; margin-top: 6px; opacity: 0.85; font-weight: 700; }
.stats { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
.stat { flex: 1; min-width: 90px; background: rgba(255,255,255,0.1); border-radius: 12px; padding: 8px 10px; }
.stat .v { font-family: var(--font-display); font-size: 1.3rem; font-weight: 700; }
.stat .k { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; opacity: 0.8; font-weight: 800; }
.flame { display: inline-block; animation: flame 1.6s ease-in-out infinite; transform-origin: 50% 90%; }
@keyframes flame { 0%,100% { transform: scale(1) rotate(-3deg);} 50% { transform: scale(1.15) rotate(3deg);} }
.section-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 26px 0 12px; }
.subjects { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
@media (min-width: 600px) { .subjects { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); } }
.subj { background: var(--surface); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; gap: 10px; text-align: left; border-top: 5px solid var(--subject); transition: transform .15s, box-shadow .15s; animation: pop .45s cubic-bezier(.2,.8,.2,1) both; }
.subj:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
.subj .ic { font-size: 28px; }
.subj .nm { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; }
.subj .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 0.78rem; color: var(--muted); font-weight: 700; }
@keyframes pop { from { opacity: 0; transform: translateY(12px) scale(.97);} to { opacity: 1; transform: none;} }
.mission { background: linear-gradient(135deg, color-mix(in srgb, var(--hi) 35%, var(--surface)), var(--surface)); }
.mission ul { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 8px; }
.mission li button { width: 100%; display: flex; align-items: center; gap: 10px; background: var(--surface); padding: 10px 12px; border-radius: var(--radius-sm); text-align: left; box-shadow: var(--shadow-sm); }
.mission li button:hover { transform: translateX(3px); }
.mission .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--subject); flex: none; }
.countdown { display: flex; align-items: center; gap: 12px; }
.countdown .n { font-family: var(--font-display); font-size: 2rem; font-weight: 700; color: var(--brand); line-height: 1; }
:root[data-theme="dark"] .countdown .n { color: var(--hi); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .countdown .n { color: var(--hi); } }

/* ---------- subject page ---------- */
.subhead { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; padding: 18px; border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow-sm); border-left: 8px solid var(--subject); }
.subhead .ic { font-size: 40px; }
.subhead .t { flex: 1; min-width: 200px; }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin: 18px 0 10px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { padding: 8px 14px; border-radius: 999px; font-weight: 800; font-size: 0.9rem; color: var(--ink-2); background: var(--surface); white-space: nowrap; border: 1.5px solid var(--line); }
.tabs button.on { background: var(--subject); color: #fff; border-color: var(--subject); }
.topics { display: grid; gap: 10px; }
.topic { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; background: var(--surface); border-radius: var(--radius-sm); padding: 12px 14px; box-shadow: var(--shadow-sm); animation: pop .4s both; }
.topic .ix { width: 34px; height: 34px; border-radius: 10px; background: color-mix(in srgb, var(--subject) 14%, transparent); color: var(--subject); display: grid; place-items: center; font-weight: 800; font-family: var(--font-display); }
.topic .tt { font-weight: 800; }
.topic .bl { font-size: 0.82rem; color: var(--muted); }
.topic .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
@media (max-width: 560px) { .topic { grid-template-columns: auto 1fr; } .topic .acts { grid-column: 1 / -1; justify-content: flex-start; } }
details.tips { background: var(--surface); border-radius: var(--radius-sm); padding: 10px 14px; box-shadow: var(--shadow-sm); }
details.tips summary { cursor: pointer; font-weight: 800; list-style: none; display: flex; align-items: center; gap: 8px; }
details.tips summary::-webkit-details-marker { display: none; }
details.tips ul { margin: 8px 0 4px; padding-left: 20px; }
details.tips li { margin: 4px 0; }

/* ---------- topic page ---------- */
.ttabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; background: var(--surface); padding: 6px; border-radius: 999px; box-shadow: var(--shadow-sm); margin: 14px 0; }
.ttabs button { padding: 9px 6px; border-radius: 999px; font-weight: 800; font-size: 0.85rem; color: var(--ink-2); display: flex; align-items: center; justify-content: center; gap: 6px; }
.ttabs button.on { background: var(--subject); color: #fff; }
.ttabs button .done { font-size: 0.75rem; }
.prose { max-width: 70ch; }
.prose h2 { font-size: 1.3rem; margin: 22px 0 8px; color: var(--subject); }
.prose h3 { font-size: 1.05rem; margin: 16px 0 6px; }
.prose p { margin: 8px 0; }
.prose ul, .prose ol { margin: 8px 0; padding-left: 22px; }
.prose li { margin: 4px 0; }
.prose code { font-family: "Nunito", monospace; background: var(--surface-2); padding: 1px 6px; border-radius: 6px; font-weight: 700; }
.prose blockquote { margin: 12px 0; padding: 10px 14px; border-left: 5px solid var(--hi); background: color-mix(in srgb, var(--hi) 18%, var(--surface)); border-radius: 0 12px 12px 0; }
.prose blockquote p { margin: 0; }
.prose table { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 0.95rem; }
.prose .tbl { overflow-x: auto; }
.prose th, .prose td { border: 1px solid var(--line); padding: 7px 10px; text-align: left; vertical-align: top; }
.prose th { background: var(--surface-2); font-weight: 800; }
.frac { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; line-height: 1.05; margin: 0 3px; font-size: 0.9em; }
.frac > span:first-child { border-bottom: 1.5px solid currentColor; padding: 0 3px; }
.frac > span:last-child { padding: 0 3px; }
.keyterms { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.flash { perspective: 900px; height: 150px; cursor: pointer; }
.flash .in { position: relative; width: 100%; height: 100%; transition: transform .5s cubic-bezier(.2,.8,.2,1); transform-style: preserve-3d; }
.flash.flip .in { transform: rotateY(180deg); }
.flash .f, .flash .b { position: absolute; inset: 0; backface-visibility: hidden; border-radius: var(--radius-sm); padding: 14px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; box-shadow: var(--shadow-sm); }
.flash .f { background: var(--surface); font-family: var(--font-display); font-size: 1.15rem; font-weight: 600; }
.flash .b { background: var(--subject); color: #fff; transform: rotateY(180deg); font-size: 0.92rem; }
.flash .hint { position: absolute; bottom: 8px; font-size: 0.7rem; color: var(--muted); font-weight: 800; }
.example { background: var(--surface); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow-sm); }
.example .prob { background: var(--surface-2); padding: 12px 14px; border-radius: var(--radius-sm); margin: 10px 0; font-weight: 600; }
.steps { display: grid; gap: 8px; margin-top: 10px; }
.step { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; padding: 10px 12px; border-radius: var(--radius-sm); border: 1.5px solid var(--line); animation: pop .35s both; }
.step .n { width: 26px; height: 26px; border-radius: 50%; background: var(--subject); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 0.8rem; }
.step.ans { border-color: var(--good); background: var(--good-bg); font-weight: 800; }
.step.ans .n { background: var(--good); }

/* ---------- quiz ---------- */
.quiz { max-width: 720px; margin: 0 auto; }
.qhead { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.qhead .bar-h { flex: 1; }
.qcard { background: var(--surface); border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow); animation: pop .35s both; }
.qcard .qtype { margin-bottom: 8px; }
.qcard .q { font-size: 1.15rem; font-weight: 700; margin-bottom: 16px; }
.opts { display: grid; gap: 10px; }
.opt { display: flex; align-items: center; gap: 12px; text-align: left; padding: 12px 14px; border-radius: var(--radius-sm); border: 2px solid var(--line); background: var(--surface); font-weight: 700; transition: .15s; }
